name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-package:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install package-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates gcc g++ libc6-dev systemd cloud-init firewalld openssh-server
          echo 'deb [trusted=yes] https://apt.fury.io/getlantern/ /' > /etc/apt/sources.list.d/getlantern.list
          apt-get update -qq
          apt-get install -y -qq sing-box-extensions
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test against the installed proxy package
        env:
          LANTERN_PACKAGE_TEST: '1'
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify the Ubuntu startup transaction
        run: |
          go build -o /usr/bin/lantern-server-manager ./cmd
          cp cloud/lantern-server-manager.service /usr/lib/systemd/system/
          cp cloud/cloud-init.service /etc/systemd/system/
          systemctl enable systemd-networkd systemd-networkd-wait-online cloud-init firewalld lantern-server-manager sing-box-extensions
          # cloud-init-generator normally pulls this target into a real boot.
          systemctl add-wants multi-user.target cloud-init.target
          systemd-analyze verify multi-user.target > startup.log 2>&1 || { cat startup.log; exit 1; }
          cat startup.log
          if grep -E 'ordering cycle|deleted to break' startup.log; then
            exit 1
          fi

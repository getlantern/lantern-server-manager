---
# playbook.yml
- name: 'Provision Image'
  hosts: default
  become: true

  tasks:
    - name: Add repository for lantern projects
      yum_repository:
        name: lantern-projects
        description: lantern-projects YUM repo
        baseurl: https://getlantern.fury.site/yum/
        gpgcheck: no
      when: ansible_os_family == "RedHat"
        
    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Install signing key for lantern projects deb repository
      copy:
        src: ../lantern-packages.asc
        dest: /etc/apt/keyrings/lantern-packages.asc
        owner: root
        group: root
        mode: '0644'
      when: ansible_os_family == "Debian"

    - name: Add deb repository for lantern projects
      apt_repository:
        state: present
        repo: deb [signed-by=/etc/apt/keyrings/lantern-packages.asc] https://apt.fury.io/getlantern/ /
      when: ansible_os_family == "Debian"

    - name: install packages
      package:
        name:
          - lantern-server-manager
          - sing-box-extensions
          - fail2ban
          - firewalld
        state: present

    - name: enable fail2ban
      systemd:
          name: fail2ban
          enabled: true
          state: started

    - name: Reload packaged systemd units and boot-order overrides
      systemd:
          daemon_reload: true

    - name: enable firewalld
      systemd:
          name: firewalld
          enabled: true
          state: started

    - name: setup firewalld for port 22 only
      ansible.posix.firewalld:
          service: ssh
          permanent: true
          state: enabled
          immediate: yes

    # Do not initialize the manager in the image: its IP and credentials must
    # be generated on the final instance, not baked into a shared snapshot.
    - name: enable manager and proxy for first instance boot
      systemd:
          name: '{{ item }}'
          enabled: true
      loop:
          - lantern-server-manager
          - sing-box-extensions

    - name: ensure values are set correctly in sysctl
      ansible.posix.sysctl:
        name: '{{ item.name }}'
        value: '{{ item.value }}'
        state: present
        reload: yes
      loop:
        - name: 'fs.file-max'
          value: '67108864'
        - name: 'net.core.default_qdisc'
          value: 'fq'
        - name: 'net.core.optmem_max'
          value: '262144'
        - name: 'net.core.rmem_max'
          value: '33554432'
        - name: 'net.core.wmem_max'
          value: '33554432'
        - name: 'net.ipv4.tcp_congestion_control'
          value: 'bbr'
        - name: 'net.ipv4.tcp_max_syn_backlog'
          value: '10240'
        - name: 'net.ipv4.tcp_fin_timeout'
          value: '25'
        - name: 'net.core.netdev_max_backlog'
          value: '32768'

    - name: Create journal directory
      file:
        path: '/var/log/journal'
        state: 'directory'
    - name: Set journal directory permissions
      command: 'systemd-tmpfiles --create --prefix /var/log/journal'
    - name: Restart journald
      service:
        name: 'systemd-journald'
        state: 'restarted'
